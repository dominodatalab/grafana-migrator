name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    # Format and type checks are interpreter-independent (mypy pins
    # python_version in pyproject), so run them once rather than per matrix leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: black
        run: black --check src tests
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject; 3.13 is what we develop on.
        # The 3.12 leg is what stops the floor quietly rotting.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
